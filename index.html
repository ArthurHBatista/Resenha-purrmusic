html{scroll-behavior:smooth}
body{background:#000;font-family:'Gill Sans','Gill Sans MT',Calibri,'Trebuchet MS',sans-serif;color:#fff;margin:0;padding:0;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 30%,rgba(255,0,0,0.08) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(255,0,0,0.04) 0%,transparent 40%),url('https://www.transparenttextures.com/patterns/asfalt-dark.png') repeat;opacity:0.8;pointer-events:none;z-index:-2}
.container{max-width:1200px;margin:0 auto;padding:30px;position:relative;z-index:1}

h1{font-family:'Cinzel Decorative',cursive;font-size:50px;text-align:center;color:#fff;text-shadow:0 0 10px #fff,0 0 30px #f00,0 0 60px #c00,0 0 100px #600;letter-spacing:6px;border:3px solid #fff;padding:15px;text-transform:uppercase;margin-top:30px;margin-bottom:50px;font-weight:900;background:linear-gradient(180deg,#1a0000 0%,#000 100%);border-radius:15px;box-shadow:0 0 20px rgba(255,255,255,.5),0 0 40px rgba(255,0,0,.3),inset 0 0 20px rgba(255,0,0,.2);display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap}
.pentagram{display:inline-block;font-size:2.5rem;color:#a00;text-shadow:0 0 10px #f00,0 0 20px #600;transition:transform .6s ease,text-shadow .3s ease;cursor:default;line-height:1}
.pentagram:hover{transform:rotate(360deg) scale(1.2);text-shadow:0 0 30px #f00,0 0 60px #f33,0 0 100px #f00}
.titulo-com-pentagrama{display:flex;justify-content:center;align-items:center;gap:15px;flex-wrap:wrap}
.titulo-com-pentagrama .pentagram{font-size:2rem}
.frase-box{max-width:800px;margin:0 auto 50px auto;padding:25px 30px;background:linear-gradient(180deg,#0a0000 0%,#000 100%);border-left:5px solid #f00;border-radius:12px;box-shadow:0 0 20px rgba(255,0,0,.3),inset 0 0 15px rgba(255,0,0,.05);text-align:center;transition:.4s ease}
.frase-box:hover{border-left-color:#f33;box-shadow:0 0 30px rgba(255,0,0,.5);transform:scale(1.01)}
#frase-texto{font-family:'Uncial Antiqua',cursive;font-size:1.35rem;color:#fff;line-height:1.6;margin:0 0 12px 0;font-style:italic;text-shadow:0 0 8px rgba(255,0,0,.4)}
#frase-autor{font-family:'Germania One',cursive;font-size:1.1rem;color:#f33;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 10px #f00;margin:0}
.categoria{margin-bottom:50px;padding:25px;background:linear-gradient(180deg,#0a0000 0%,#000 100%);border:3px solid #fff;border-radius:20px;box-shadow:0 0 15px rgba(255,255,255,.3),0 0 30px rgba(255,0,0,.2),inset 0 0 15px rgba(255,0,0,.1);position:relative;overflow:hidden;transition:.4s ease}

.categoria:hover::after{opacity:1}
h2{font-family:'Germania One',cursive;font-size:32px;text-align:center;color:#fff;text-shadow:0 0 5px #fff,0 0 15px #f00,0 0 30px #c00,0 0 60px #600;padding:12px;margin:0 0 35px 0;text-transform:uppercase;letter-spacing:4px;font-weight:bold;border:2px solid #fff;border-radius:10px;background:linear-gradient(90deg,#1a0000 0%,#0a0000 50%,#1a0000 100%);box-shadow:0 0 10px rgba(255,255,255,.4),0 0 20px rgba(255,0,0,.3)}

.cat-nu-metal h2{border-color:#f00;color:#f33;background:linear-gradient(90deg,#2a0000 0%,#0a0000 50%,#2a0000 100%)}

.rune{position:fixed;bottom:20px;right:20px;font-size:5rem;color:#822;opacity:.15;animation:spinRune 20s linear infinite;pointer-events:none;z-index:2}

footer{margin-top:60px;padding:30px 0;border-top:3px solid #900;text-align:center;background:linear-gradient(180deg,#000,#0a0000);font-family:'Germania One',cursive}

footer .copy{margin-top:15px;opacity:.6;font-size:.9rem}

@media (max-width:768px){

h1{font-size:30px;padding:10px;gap:10px}

.icon-tema{font-size:1.5rem}

.videos iframe{width:100%;height:auto;aspect-ratio:16/9}

#top-nav ul{gap:8px}
#top-nav a{font-size:.85rem;padding:4px 8px;letter-spacing:1px}
.rune{font-size:3rem;bottom:10px;right:10px}
.frase-box{padding:20px}
#frase-texto{font-size:1.1rem}
#frase-autor{font-size:.95rem}

::selection{background:#f00;color:#fff}
</style>
</head>
