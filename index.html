<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PURRmusic – Gore & Folk Metal</title>
    <!-- ... suas fonts e estilos ... -->
    <style>
        /* ===== SEU CSS ATUAL + O BODE ===== */
        .bode-fixo {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 2;
            width: 100px;
            height: 100px;
            pointer-events: none;
            filter: drop-shadow(0 0 20px #ff0000);
            transition: transform 0.5s ease;
        }
        .bode-fixo:hover {
            transform: scale(1.1) rotate(5deg);
        }
        /* Responsivo */
        @media (max-width: 768px) {
            .bode-fixo {
                width: 70px;
                height: 70px;
                bottom: 10px;
                left: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- BODE FIXO -->
    <div class="bode-fixo">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Chifres curvos -->
            <path d="M60,60 C30,20 10,40 20,70 C30,80 50,70 60,60" fill="#cc0000" opacity="0.9"/>
            <path d="M140,60 C170,20 190,40 180,70 C170,80 150,70 140,60" fill="#cc0000" opacity="0.9"/>
            <!-- Cabeça -->
            <ellipse cx="100" cy="120" rx="55" ry="45" fill="#cc0000" opacity="0.9"/>
            <!-- Orelhas -->
            <ellipse cx="50" cy="100" rx="18" ry="28" fill="#cc0000" opacity="0.9" transform="rotate(-25 50 100)"/>
            <ellipse cx="150" cy="100" rx="18" ry="28" fill="#cc0000" opacity="0.9" transform="rotate(25 150 100)"/>
            <!-- Olhos -->
            <circle cx="75" cy="115" r="7" fill="#000"/>
            <circle cx="125" cy="115" r="7" fill="#000"/>
            <!-- Pupilas vermelhas (glow) -->
            <circle cx="75" cy="115" r="2.5" fill="#ff0000" filter="url(#glow)"/>
            <circle cx="125" cy="115" r="2.5" fill="#ff0000" filter="url(#glow)"/>
            <!-- Focinho -->
            <ellipse cx="100" cy="138" rx="18" ry="12" fill="#aa0000"/>
            <!-- Barba -->
            <path d="M85,148 Q100,180 115,148" fill="#cc0000" opacity="0.7"/>
            <!-- PENTAGRAMA NA TESTA -->
            <polygon points="100,82 107,98 124,98 110,109 115,127 100,117 85,127 90,109 76,98 93,98"
                     fill="none" stroke="#ffffff" stroke-width="2.5"/>
            <polygon points="100,82 107,98 124,98 110,109 115,127 100,117 85,127 90,109 76,98 93,98"
                     fill="none" stroke="#ff0000" stroke-width="4" opacity="0.5" filter="url(#glow)"/>
            <defs>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
            </defs>
        </svg>
    </div>

    <!-- O RESTO DO SEU SITE (MENU, VÍDEOS, ETC) -->
    <!-- ... -->
</body>
</html>
