<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PURRmusic – Gore & Folk Metal</title>

    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Germania+One&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <style>
        /* ========== BASE ========== */
        html { scroll-behavior: smooth; }

        body {
            background-color: #000000;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            transition: background-color 1.8s ease;
        }

        /* ===== FUNDO DINÂMICO EM CAMADAS ===== */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -3;
            transition: background 2s ease, opacity 2s ease;
        }

        /* Camada 1: gradientes radiais que mudam de cor */
        #bg-gradients {
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 0, 0, 0.18) 0%, transparent 55%),
                radial-gradient(circle at 85% 80%, rgba(255, 0, 0, 0.10) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(60, 0, 0, 0.25) 0%, transparent 70%);
        }

        /* Camada 2: textura de fundo */
        #bg-texture {
            background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png') repeat;
            opacity: 0.18;
            z-index: -2;
        }

        /* Camada 3: vinheta (bordas escuras) */
        #bg-vignette {
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
            z-index: -1;
        }

        /* Camada 4: partículas/faíscas */
        #bg-particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
            transition: opacity 1.5s ease;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
            animation: floatParticle linear infinite;
            transition: background 2s ease;
        }
        @keyframes floatParticle {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 0.7; }
            90%  { opacity: 0.7; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ========== TEMAS DINÂMICOS ========== */
        /* Cada tema define as cores das camadas via CSS variables */

        /* Nu Metal – vermelho sangue */
        body[data-tema="nu-metal"] #bg-gradients {
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 0, 0, 0.20) 0%, transparent 55%),
                radial-gradient(circle at 85% 80%, rgba(180, 0, 0, 0.14) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(80, 0, 0, 0.30) 0%, transparent 70%);
        }

        /* RapTuga – dourado/âmbar */
        body[data-tema="raptuga"] #bg-gradients {
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 170, 0, 0.20) 0%, transparent 55%),
                radial-gradient(circle at 85% 80%, rgba(200, 120, 0, 0.14) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(80, 50, 0, 0.30) 0%, transparent 70%);
        }

        /* Deftones – azul-petróleo */
        body[data-tema="deftones"] #bg-gradients {
            background:
                radial-gradient(circle at 15% 20%, rgba(51, 170, 255, 0.20) 0%, transparent 55%),
                radial-gradient(circle at 85% 80%, rgba(0, 100, 180, 0.14) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 30, 60, 0.35) 0%, transparent 70%);
        }

        /* S.O.A.D – laranja-fogo */
        body[data-tema="soad"] #bg-gradients {
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 102, 0, 0.22) 0%, transparent 55%),
                radial-gradient(circle at 85% 80%, rgba(200, 50, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(80, 25, 0, 0.35) 0%, transparent 70%);
        }

        /* METALLICA – prata/aço */
        body[data-tema="metallica"] #bg-gradients {
            background:
                radial-gradient(circle at 15% 20%, rgba(200, 200, 200, 0.15) 0%, transparent 55%),
                radial-gradient(circle at 85% 80%, rgba(140, 140, 140, 0.10) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(40, 40, 40, 0.40) 0%, transparent 70%);
        }

        /* Folk Metal – verde-floresta */
        body[data-tema="folk-metal"] #bg-gradients {
            background:
                radial-gradient(circle at 15% 20%, rgba(102, 204, 51, 0.20) 0%, transparent 55%),
                radial-gradient(circle at 85% 80%, rgba(50, 130, 0, 0.14) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(20, 60, 0, 0.35) 0%, transparent 70%);
        }

        /* Topo (antes de qualquer categoria) – padrão vermelho escuro */
        body[data-tema="hero"] #bg-gradients {
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 0, 0, 0.18) 0%, transparent 55%),
                radial-gradient(circle at 85% 80%, rgba(255, 0, 0, 0.10) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(60, 0, 0, 0.30) 0%, transparent 70%);
        }

        /* Cor das partículas por tema */
        body[data-tema="nu-metal"] .particle { background: #ff3333; box-shadow: 0 0 8px #ff0000; }
        body[data-tema="raptuga"] .particle { background: #ffcc33; box-shadow: 0 0 8px #ffaa00; }
        body[data-tema="deftones"] .particle { background: #66ccff; box-shadow: 0 0 8px #33aaff; }
        body[data-tema="soad"] .particle { background: #ff8833; box-shadow: 0 0 8px #ff6600; }
        body[data-tema="metallica"] .particle { background: #cccccc; box-shadow: 0 0 8px #ffffff; }
        body[data-tema="folk-metal"] .particle { background: #88dd55; box-shadow: 0 0 8px #66cc33; }
        body[data-tema="hero"] .particle { background: #ff3333; box-shadow: 0 0 8px #ff0000; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            position: relative;
            z-index: 1;
        }

        /* ===== MENU ===== */
        #top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 3px solid #990000;
            box-shadow: 0 0 30px #660000;
            padding: 10px 0;
            margin-bottom: 20px;
            transition: border-color 1.5s ease, box-shadow 1.5s ease;
        }
        body[data-tema="raptuga"] #top-nav { border-color: #cc8800; box-shadow: 0 0 30px #664400; }
        body[data-tema="deftones"] #top-nav { border-color: #0066cc; box-shadow: 0 0 30px #003366; }
        body[data-tema="soad"] #top-nav { border-color: #cc5500; box-shadow: 0 0 30px #661a00; }
        body[data-tema="metallica"] #top-nav { border-color: #999999; box-shadow: 0 0 30px #444444; }
        body[data-tema="folk-metal"] #top-nav { border-color: #448800; box-shadow: 0 0 30px #1a4400; }

        #top-nav ul {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px 20px;
            list-style: none;
            margin: 0;
            padding: 0 20px;
        }
        #top-nav a {
            color: #fff;
            text-decoration: none;
            font-family: 'Germania One', cursive;
            font-size: 1.1rem;
            letter-spacing: 2px;
            padding: 5px 12px;
            transition: 0.3s;
            border-radius: 5px;
        }
        #top-nav a:hover { color: #ff3333; text-shadow: 0 0 20px #ff0000; background: rgba(255,0,0,0.1); }

        /* ===== TÍTULO ===== */
        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 50px;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 10px #fff, 0 0 30px #ff0000, 0 0 60px #cc0000, 0 0 100px #660000;
            letter-spacing: 6px;
            border: 3px solid #ffffff;
            padding: 15px;
            text-transform: uppercase;
            margin-top: 30px;
            margin-bottom: 50px;
            font-weight: 900;
            background: linear-gradient(180deg, #1a0000 0%, #000000 100%);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255,255,255,0.5), 0 0 40px rgba(255,0,0,0.3), inset 0 0 20px rgba(255,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* ===== PENTAGRAMA ===== */
        .pentagram {
            display: inline-block;
            font-size: 2.5rem;
            color: #aa0000;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #660000;
            transition: transform 0.6s ease, text-shadow 0.3s ease;
            cursor: default;
            line-height: 1;
        }
        .pentagram:hover {
            transform: rotate(360deg) scale(1.2);
            text-shadow: 0 0 30px #ff0000, 0 0 60px #ff3333, 0 0 100px #ff0000;
        }
        .titulo-com-pentagrama {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .titulo-com-pentagrama .pentagram { font-size: 2rem; }

        /* ===== CATEGORIAS BASE ===== */
        .categoria {
            margin-bottom: 50px;
            padding: 25px;
            background: linear-gradient(180deg, rgba(10,0,0,0.85) 0%, rgba(0,0,0,0.85) 100%);
            border: 3px solid #ffffff;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255,255,255,0.3), 0 0 30px rgba(255,0,0,0.2), inset 0 0 15px rgba(255,0,0,0.1);
            position: relative;
            overflow: hidden;
            transition: 0.5s ease;
            backdrop-filter: blur(2px);
        }
        .categoria::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255,0,0,0.08), transparent 60%);
            opacity: 0;
            transition: 0.5s;
            pointer-events: none;
        }
        .categoria:hover::after { opacity: 1; }

        h2 {
            font-family: 'Germania One', cursive;
            font-size: 32px;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 5px #fff, 0 0 15px #ff0000, 0 0 30px #cc0000, 0 0 60px #660000;
            padding: 12px;
            margin: 0 0 35px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
            border: 2px solid #ffffff;
            border-radius: 10px;
            background: linear-gradient(90deg, #1a0000 0%, #0a0000 50%, #1a0000 100%);
            box-shadow: 0 0 10px rgba(255,255,255,0.4), 0 0 20px rgba(255,0,0,0.3);
        }

        /* ===== PERSONALIZAÇÃO POR ESTILO ===== */
        .cat-nu-metal { border-color: #ff0000; box-shadow: 0 0 20px rgba(255,0,0,0.6), 0 0 40px rgba(255,0,0,0.3), inset 0 0 20px rgba(255,0,0,0.15); }
        .cat-nu-metal h2 { border-color: #ff0000; color: #ff3333; background: linear-gradient(90deg, #2a0000 0%, #0a0000 50%, #2a0000 100%); }

        .cat-raptuga { border-color: #ffaa00; box-shadow: 0 0 20px rgba(255,170,0,0.5), 0 0 40px rgba(255,170,0,0.25), inset 0 0 20px rgba(255,170,0,0.12); }
        .cat-raptuga h2 { border-color: #ffaa00; color: #ffcc33; background: linear-gradient(90deg, #2a1a00 0%, #0a0500 50%, #2a1a00 100%); }

        .cat-deftones { border-color: #33aaff; box-shadow: 0 0 20px rgba(51,170,255,0.5), 0 0 40px rgba(51,170,255,0.25), inset 0 0 20px rgba(51,170,255,0.12); }
        .cat-deftones h2 { border-color: #33aaff; color: #66ccff; background: linear-gradient(90deg, #001a2a 0%, #000a0a 50%, #001a2a 100%); }

        .cat-soad { border-color: #ff6600; box-shadow: 0 0 20px rgba(255,102,0,0.6), 0 0 40px rgba(255,102,0,0.3), inset 0 0 20px rgba(255,102,0,0.15); }
        .cat-soad h2 { border-color: #ff6600; color: #ff8833; background: linear-gradient(90deg, #2a0f00 0%, #0a0500 50%, #2a0f00 100%); }

        .cat-metallica { border-color: #cccccc; box-shadow: 0 0 20px rgba(204,204,204,0.5), 0 0 40px rgba(204,204,204,0.25), inset 0 0 20px rgba(204,204,204,0.12); }
        .cat-metallica h2 { border-color: #cccccc; color: #e6e6e6; background: linear-gradient(90deg, #1a1a1a 0%, #0a0a0a 50%, #1a1a1a 100%); }

        .cat-folk-metal { border-color: #66cc33; box-shadow: 0 0 20px rgba(102,204,51,0.5), 0 0 40px rgba(102,204,51,0.25), inset 0 0 20px rgba(102,204,51,0.12); }
        .cat-folk-metal h2 { border-color: #66cc33; color: #88dd55; background: linear-gradient(90deg, #0a2a00 0%, #050a00 50%, #0a2a00 100%); }

        .icon-tema {
            font-size: 2rem;
            transition: transform 0.6s ease, filter 0.3s ease;
            cursor: default;
            display: inline-block;
        }
        .icon-tema:hover {
            transform: rotate(360deg) scale(1.2);
            filter: drop-shadow(0 0 15px currentColor);
        }
        .cat-nu-metal .icon-tema { color: #ff0000; }
        .cat-raptuga .icon-tema { color: #ffaa00; }
        .cat-deftones .icon-tema { color: #33aaff; }
        .cat-soad .icon-tema { color: #ff6600; }
        .cat-metallica .icon-tema { color: #cccccc; }
        .cat-folk-metal .icon-tema { color: #66cc33; }

        /* ===== VÍDEOS ===== */
        .videos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 35px;
        }
        .videos iframe {
            width: 380px;
            height: 214px;
            border: 4px solid #ffffff;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(255,255,255,0.6), 0 0 30px rgba(255,0,0,0.3), 0 0 60px rgba(255,0,0,0.1);
            transition: 0.4s ease;
        }
        .videos iframe:hover {
            border-color: #ff0000;
            box-shadow: 0 0 20px #fff, 0 0 40px #ff0000, 0 0 80px #660000, inset 0 0 30px #ff0000;
            transform: scale(1.03) rotate(0.5deg);
        }
        .cat-nu-metal .videos iframe:hover { border-color: #ff0000; box-shadow: 0 0 20px #fff, 0 0 40px #ff0000, 0 0 80px #660000; }
        .cat-raptuga .videos iframe:hover { border-color: #ffaa00; box-shadow: 0 0 20px #fff, 0 0 40px #ffaa00, 0 0 80px #664400; }
        .cat-deftones .videos iframe:hover { border-color: #33aaff; box-shadow: 0 0 20px #fff, 0 0 40px #33aaff, 0 0 80px #003366; }
        .cat-soad .videos iframe:hover { border-color: #ff6600; box-shadow: 0 0 20px #fff, 0 0 40px #ff6600, 0 0 80px #661a00; }
        .cat-metallica .videos iframe:hover { border-color: #cccccc; box-shadow: 0 0 20px #fff, 0 0 40px #cccccc, 0 0 80px #444444; }
        .cat-folk-metal .videos iframe:hover { border-color: #66cc33; box-shadow: 0 0 20px #fff, 0 0 40px #66cc33, 0 0 80px #1a4400; }

        /* ===== VÍDEO DESTAQUE ===== */
        .video-destaque { display: flex; justify-content: center; margin-bottom: 50px; }
        #player-destaque {
            width: 500px; height: 281px;
            border: 4px solid #ffffff;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255,255,255,0.7), 0 0 80px rgba(255,0,0,0.4), 0 0 120px rgba(255,0,0,0.2);
            transition: 0.3s;
        }
        #player-destaque:hover {
            border-color: #ff0000;
            box-shadow: 0 0 20px #fff, 0 0 60px #ff0000, 0 0 100px #660000;
            transform: scale(1.02);
        }

        /* ===== DIVISÓRIAS ===== */
        .divider {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            color: #aa0000;
            font-size: 2.2rem;
            margin: 10px 0 40px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, #aa0000, transparent);
        }
        .divider .pentagram { font-size: 2rem; }

        /* ===== RUNA ===== */
        .rune {
            position: fixed;
            bottom: 20px; right: 20px;
            font-size: 5rem;
            color: #882222;
            opacity: 0.15;
            animation: spinRune 20s linear infinite;
            pointer-events: none;
            z-index: 2;
            transition: color 1.5s ease;
        }
        body[data-tema="raptuga"] .rune { color: #886622; }
        body[data-tema="deftones"] .rune { color: #226688; }
        body[data-tema="soad"] .rune { color: #883322; }
        body[data-tema="metallica"] .rune { color: #666666; }
        body[data-tema="folk-metal"] .rune { color: #338822; }
        @keyframes spinRune {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* ===== RODAPÉ ===== */
        footer {
            margin-top: 60px;
            padding: 30px 0;
            border-top: 3px solid #990000;
            text-align: center;
            background: linear-gradient(180deg, #000, #0a0000);
            font-family: 'Germania One', cursive;
            transition: border-color 1.5s ease;
        }
        footer .social a { color: #fff; font-size: 2rem; margin: 0 15px; transition: 0.3s; }
        footer .social a:hover { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
        footer .copy { margin-top: 15px; opacity: 0.6; font-size: 0.9rem; }
        footer .copy i { color: #aa0000; }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 768px) {
            .container { padding: 15px; }
            h1 { font-size: 30px; padding: 10px; gap: 10px; }
            .pentagram { font-size: 1.8rem; }
            .titulo-com-pentagrama .pentagram { font-size: 1.5rem; }
            .icon-tema { font-size: 1.5rem; }
            h2 { font-size: 24px; }
            .videos iframe { width: 100%; height: auto; aspect-ratio: 16/9; }
            #player-destaque { width: 100%; height: auto; aspect-ratio: 16/9; }
            #top-nav ul { gap: 10px; }
            #top-nav a { font-size: 1rem; padding: 5px 10px; }
            .rune { font-size: 3rem; bottom: 10px; right: 10px; }
        }

        ::selection { background-color: #ff0000; color: #ffffff; }
    </style>
</head>

<body data-tema="hero">

    <!-- FUNDO DINÂMICO EM CAMADAS -->
    <div id="bg-gradients" class="bg-layer"></div>
    <div id="bg-texture" class="bg-layer"></div>
    <div id="bg-vignette" class="bg-layer"></div>
    <div id="bg-particles"></div>

    <!-- Menu fixo -->
    <nav id="top-nav">
        <ul>
            <li><a href="#nu-metal">Nu Metal</a></li>
            <li><a href="#raptuga">RapTuga</a></li>
            <li><a href="#deftones">Deftones</a></li>
            <li><a href="#soad">S.O.A.D</a></li>
            <li><a href="#metallica">METALLICA</a></li>
            <li><a href="#folk-metal">Folk Metal</a></li>
        </ul>
    </nav>

    <div class="container">

        <h1>
            <span class="pentagram">⛧</span>
            PurrMusic
            <span class="pentagram">⛧</span>
        </h1>

        <!-- Vídeo em destaque -->
        <div class="video-destaque">
            <div id="player-destaque"></div>
        </div>

        <!-- ==================== NU METAL ==================== -->
        <div class="categoria cat-nu-metal" id="nu-metal" data-aos="fade-up" data-tema="nu-metal">
            <div class="titulo-com-pentagrama">
                <i class="fas fa-link icon-tema"></i>
                <h2>Nu Metal</h2>
                <i class="fas fa-skull icon-tema"></i>
            </div>
            <div class="videos">
                <iframe src="https://www.youtube.com/embed/WLubS6QOMsQ" title="Slipknot - Eyeless" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
                <iframe src="https://www.youtube.com/embed/m9NEjUb_Ag0" title="Limp Bizkit - Rollin'" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
                <iframe src="https://www.youtube.com/embed/nRz-yw-wp34" title="Korn - Twist" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
            </div>
        </div>

        <div class="divider">
            <i class="fas fa-skull"></i><i class="fas fa-axe"></i><i class="fas fa-skull"></i>
        </div>

        <!-- ==================== RAPTuga ==================== -->
        <div class="categoria cat-raptuga" id="raptuga" data-aos="fade-up" data-tema="raptuga">
            <div class="titulo-com-pentagrama">
                <i class="fas fa-microphone icon-tema"></i>
                <h2>RapTuga</h2>
                <i class="fas fa-fire icon-tema"></i>
            </div>
            <div class="videos">
                <iframe src="https://www.youtube.com/embed/J9VlkMxl6wk" title="Atlantis" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
                <iframe src="https://www.youtube.com/embed/_95Vqd38i0o" title="Peel Me" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
                <iframe src="https://www.youtube.com/embed/urOBTEqo4RE" title="Quando a Minha Vóz" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
            </div>
        </div>

        <div class="divider">
            <i class="fas fa-skull"></i><i class="fas fa-axe"></i><i class="fas fa-skull"></i>
