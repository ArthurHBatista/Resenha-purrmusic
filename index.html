<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Stars</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Germania+One&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <style>
        /* ========== BASE ========== */
        html { scroll-behavior: smooth; }

        body {
            background-color: #000000;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(255, 0, 0, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 0, 0.04) 0%, transparent 40%),
                url('https://www.transparenttextures.com/patterns/asfalt-dark.png') repeat;
            opacity: 0.8;
            pointer-events: none;
            z-index: -2;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            position: relative;
            z-index: 1;
        }

        #top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 3px solid #990000;
            box-shadow: 0 0 30px #660000;
            padding: 10px 0;
            margin-bottom: 20px;
        }
        #top-nav ul {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px 15px;
            list-style: none;
            margin: 0;
            padding: 0 20px;
        }
        #top-nav a {
            color: #fff;
            text-decoration: none;
            font-family: 'Germania One', cursive;
            font-size: 1rem;
            letter-spacing: 1.5px;
            padding: 5px 12px;
            transition: 0.3s;
            border-radius: 5px;
        }
        #top-nav a:hover { color: #ff3333; text-shadow: 0 0 20px #ff0000; background: rgba(255,0,0,0.1); }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 50px;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 10px #fff, 0 0 30px #ff0000, 0 0 60px #cc0000, 0 0 100px #660000;
            letter-spacing: 6px;
            border: 3px solid #ffffff;
            padding: 15px;
            text-transform: uppercase;
            margin-top: 30px;
            margin-bottom: 50px;
            font-weight: 900;
            background: linear-gradient(180deg, #1a0000 0%, #000000 100%);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255,255,255,0.5), 0 0 40px rgba(255,0,0,0.3), inset 0 0 20px rgba(255,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .pentagram {
            display: inline-block;
            font-size: 2.5rem;
            color: #aa0000;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #660000;
            transition: transform 0.6s ease, text-shadow 0.3s ease;
            cursor: default;
            line-height: 1;
        }
        .pentagram:hover {
            transform: rotate(360deg) scale(1.2);
            text-shadow: 0 0 30px #ff0000, 0 0 60px #ff3333, 0 0 100px #ff0000;
        }
        .titulo-com-pentagrama {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .titulo-com-pentagrama .pentagram { font-size: 2rem; }

        /* ===== FRASE DO DIA ===== */
        .frase-box {
            max-width: 800px;
            margin: 0 auto 50px auto;
            padding: 25px 30px;
            background: linear-gradient(180deg, #0a0000 0%, #000 100%);
            border-left: 5px solid #ff0000;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255,0,0,0.3), inset 0 0 15px rgba(255,0,0,0.05);
            position: relative;
            text-align: center;
            transition: 0.4s ease;
        }
        .frase-box::before {
            content: '“';
            position: absolute;
            top: -20px; left: 15px;
            font-size: 5rem;
            color: #ff0000;
            opacity: 0.4;
            font-family: 'Cinzel Decorative', cursive;
            line-height: 1;
        }
        .frase-box::after {
            content: '”';
            position: absolute;
            bottom: -40px; right: 15px;
            font-size: 5rem;
            color: #ff0000;
            opacity: 0.4;
            font-family: 'Cinzel Decorative', cursive;
            line-height: 1;
        }
        .frase-box:hover {
            border-left-color: #ff3333;
            box-shadow: 0 0 30px rgba(255,0,0,0.5), inset 0 0 25px rgba(255,0,0,0.1);
            transform: scale(1.01);
        }
        #frase-texto {
            font-family: 'Uncial Antiqua', cursive;
            font-size: 1.35rem;
            color: #fff;
            line-height: 1.6;
            margin: 0 0 12px 0;
            font-style: italic;
            text-shadow: 0 0 8px rgba(255,0,0,0.4);
        }
        #frase-autor {
            font-family: 'Germania One', cursive;
            font-size: 1.1rem;
            color: #ff3333;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #ff0000;
            margin: 0;
        }

        .categoria {
            margin-bottom: 50px;
            padding: 25px;
            background: linear-gradient(180deg, #0a0000 0%, #000000 100%);
            border: 3px solid #ffffff;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255,255,255,0.3), 0 0 30px rgba(255,0,0,0.2), inset 0 0 15px rgba(255,0,0,0.1);
            position: relative;
            overflow: hidden;
            transition: 0.4s ease;
        }
        .categoria::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255,0,0,0.08), transparent 60%);
            opacity: 0;
            transition: 0.5s;
            pointer-events: none;
        }
        .categoria:hover::after { opacity: 1; }

        h2 {
            font-family: 'Germania One', cursive;
            font-size: 32px;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 5px #fff, 0 0 15px #ff0000, 0 0 30px #cc0000, 0 0 60px #660000;
            padding: 12px;
            margin: 0 0 35px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
            border: 2px solid #ffffff;
            border-radius: 10px;
            background: linear-gradient(90deg, #1a0000 0%, #0a0000 50%, #1a0000 100%);
            box-shadow: 0 0 10px rgba(255,255,255,0.4), 0 0 20px rgba(255,0,0,0.3);
        }

        /* ===== PERSONALIZAÇÃO POR ESTILO ===== */
        .cat-nu-metal { border-color: #ff0000; box-shadow: 0 0 20px rgba(255,0,0,0.6), 0 0 40px rgba(255,0,0,0.3), inset 0 0 20px rgba(255,0,0,0.15); }
        .cat-nu-metal h2 { border-color: #ff0000; color: #ff3333; background: linear-gradient(90deg, #2a0000 0%, #0a0000 50%, #2a0000 100%); }
        .cat-nu-metal .icon-tema { color: #ff0000; }

        .cat-raptuga { border-color: #ffaa00; box-shadow: 0 0 20px rgba(255,170,0,0.5), 0 0 40px rgba(255,170,0,0.25), inset 0 0 20px rgba(255,170,0,0.12); }
        .cat-raptuga h2 { border-color: #ffaa00; color: #ffcc33; background: linear-gradient(90deg, #2a1a00 0%, #0a0500 50%, #2a1a00 100%); }
        .cat-raptuga .icon-tema { color: #ffaa00; }

        .cat-deftones { border-color: #33aaff; box-shadow: 0 0 20px rgba(51,170,255,0.5), 0 0 40px rgba(51,170,255,0.25), inset 0 0 20px rgba(51,170,255,0.12); }
        .cat-deftones h2 { border-color: #33aaff; color: #66ccff; background: linear-gradient(90deg, #001a2a 0%, #000a0a 50%, #001a2a 100%); }
        .cat-deftones .icon-tema { color: #33aaff; }

        .cat-soad { border-color: #ff6600; box-shadow: 0 0 20px rgba(255,102,0,0.6), 0 0 40px rgba(255,102,0,0.3), inset 0 0 20px rgba(255,102,0,0.15); }
        .cat-soad h2 { border-color: #ff6600; color: #ff8833; background: linear-gradient(90deg, #2a0f00 0%, #0a0500 50%, #2a0f00 100%); }
        .cat-soad .icon-tema { color: #ff6600; }

        .cat-metallica { border-color: #cccccc; box-shadow: 0 0 20px rgba(204,204,204,0.5), 0 0 40px rgba(204,204,204,0.25), inset 0 0 20px rgba(204,204,204,0.12); }
        .cat-metallica h2 { border-color: #cccccc; color: #e6e6e6; background: linear-gradient(90deg, #1a1a1a 0%, #0a0a0a 50%, #1a1a1a 100%); }
        .cat-metallica .icon-tema { color: #cccccc; }

        .cat-folk-metal { border-color: #66cc33; box-shadow: 0 0 20px rgba(102,204,51,0.5), 0 0 40px rgba(102,204,51,0.25), inset 0 0 20px rgba(102,204,51,0.12); }
        .cat-folk-metal h2 { border-color: #66cc33; color: #88dd55; background: linear-gradient(90deg, #0a2a00 0%, #050a00 50%, #0a2a00 100%); }
        .cat-folk-metal .icon-tema { color: #66cc33; }

        /* ===== DEATH METAL (NOVA COR: VERMELHO-SANGUE ESCURO) ===== */
        .cat-death-metal {
            border-color: #8b0000;
            box-shadow:
                0 0 20px rgba(139,0,0,0.7),
                0 0 45px rgba(139,0,0,0.35),
                0 0 80px rgba(74,0,0,0.2),
                inset 0 0 25px rgba(139,0,0,0.2);
            background: linear-gradient(180deg, #150000 0%, #050000 100%);
        }
        .cat-death-metal h2 {
            border-color: #8b0000;
            color: #cc2222;
            background: linear-gradient(90deg, #2a0000 0%, #150000 50%, #2a0000 100%);
            text-shadow: 0 0 8px #ff0000, 0 0 20px #8b0000, 0 0 40px #4a0000;
        }
        .cat-death-metal .icon-tema {
            color: #cc0000;
            text-shadow: 0 0 15px #8b0000;
        }
        .cat-death-metal .videos iframe:hover {
            border-color: #8b0000;
            box-shadow:
                0 0 20px #fff,
                0 0 45px #cc0000,
                0 0 90px #8b0000,
                inset 0 0 30px #4a0000;
        }
        .cat-death-metal .videos iframe {
            box-shadow:
                0 0 10px rgba(255,255,255,0.6),
                0 0 30px rgba(139,0,0,0.4),
                0 0 60px rgba(74,0,0,0.2);
        }

        .icon-tema {
            font-size: 2rem;
            transition: transform 0.6s ease, filter 0.3s ease;
            cursor: default;
            display: inline-block;
        }
        .icon-tema:hover {
            transform: rotate(360deg) scale(1.2);
            filter: drop-shadow(0 0 15px currentColor);
        }

        .videos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 35px;
        }
        .videos iframe {
            width: 380px;
            height: 214px;
            border: 4px solid #ffffff;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(255,255,255,0.6), 0 0 30px rgba(255,0,0,0.3), 0 0 60px rgba(255,0,0,0.1);
            transition: 0.4s ease;
        }
        .videos iframe:hover { transform: scale(1.03) rotate(0.5deg); }
        .cat-nu-metal .videos iframe:hover { border-color: #ff0000; box-shadow: 0 0 20px #fff, 0 0 40px #ff0000, 0 0 80px #660000; }
        .cat-raptuga .videos iframe:hover { border-color: #ffaa00; box-shadow: 0 0 20px #fff, 0 0 40px #ffaa00, 0 0 80px #664400; }
        .cat-deftones .videos iframe:hover { border-color: #33aaff; box-shadow: 0 0 20px #fff, 0 0 40px #33aaff, 0 0 80px #003366; }
        .cat-soad .videos iframe:hover { border-color: #ff6600; box-shadow: 0 0 20px #fff, 0 0 40px #ff6600, 0 0 80px #661a00; }
        .cat-metallica .videos iframe:hover { border-color: #cccccc; box-shadow: 0 0 20px #fff, 0 0 40px #cccccc, 0 0 80px #444444; }
        .cat-folk-metal .videos iframe:hover { border-color: #66cc33; box-shadow: 0 0 20px #fff, 0 0 40px #66cc33, 0 0 80px #1a4400; }

        .video-destaque { display: flex; justify-content: center; margin-bottom: 50px; }
        #player-destaque {
            width: 500px; height: 281px;
            border: 4px solid #ffffff;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255,255,255,0.7), 0 0 80px rgba(255,0,0,0.4), 0 0 120px rgba(255,0,0,0.2);
            transition: 0.3s;
        }
        #player-destaque:hover {
            border-color: #ff0000;
            box-shadow: 0 0 20px #fff, 0 0 60px #ff0000, 0 0 100px #660000;
            transform: scale(1.02);
        }

        .divider {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            color: #aa0000;
            font-size: 2.2rem;
            margin: 10px 0 40px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, #aa0000, transparent);
        }
        .divider .pentagram { font-size: 2rem; }

        .rune {
            position: fixed;
            bottom: 20px; right: 20px;
            font-size: 5rem;
            color: #882222;
            opacity: 0.15;
            animation: spinRune 20s linear infinite;
            pointer-events: none;
            z-index: 2;
        }
        @keyframes spinRune {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        footer {
            margin-top: 60px;
            padding: 30px 0;
            border-top: 3px solid #990000;
            text-align: center;
            background: linear-gradient(180deg, #000, #0a0000);
            font-family: 'Germania One', cursive;
        }
        footer .social a { color: #fff; font-size: 2rem; margin: 0 15px; transition: 0.3s; display: inline-block; }
        footer .social a:hover { color: #ff0000; text-shadow: 0 0 20px #ff0000; transform: scale(1.2); }
        footer .social a.instagram:hover { color: #ff3399; text-shadow: 0 0 20px #ff3399; }
        footer .copy { margin-top: 15px; opacity: 0.6; font-size: 0.9rem; }
        footer .copy i { color: #aa0000; }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            h1 { font-size: 30px; padding: 10px; gap: 10px; }
            .pentagram { font-size: 1.8rem; }
            .titulo-com-pentagrama .pentagram { font-size: 1.5rem; }
            .icon-tema { font-size: 1.5rem; }
            h2 { font-size: 24px; }
            .videos iframe { width: 100%; height: auto; aspect-ratio: 16/9; }
            #player-destaque { width: 100%; height: auto; aspect-ratio: 16/9; }
            #top-nav ul { gap: 8px; }
            #top-nav a { font-size: 0.85rem; padding: 4px 8px; letter-spacing: 1px; }
            .rune { font-size: 3rem; bottom: 10px; right: 10px; }
            .frase-box { padding: 20px; }
            #frase-texto { font-size: 1.1rem; }
            #frase-autor { font-size: 0.95rem; }
        }

        ::selection { background-color: #ff0000; color: #ffffff; }
    </style>
</head>

<body>

    <nav id="top-nav">
        <ul>
            <li><a href="#nu-metal">Nu Metal</a></li>
            <li><a href="#raptuga">RapTuga</a></li>
            <li><a href="#deftones">Deftones</a></li>
            <li><a href="#soad">S.O.A.D</a></li>
            <li><a href="#metallica">METALLICA</a></li>
            <li><a href="#folk-metal">Folk Metal</a></li>
            <li><a href="#death-metal">Death Metal</a></li>
        </ul>
    </nav>

    <div class="container">

        <h1>
            <span class="pentagram">⛧</span>
            The Stars
            <span class="pentagram">⛧</span>
        </h1>

        <!-- ===== FRASE ALEATÓRIA DO DIA ===== -->
        <div class="frase-box" id="frase-box">
            <p id="frase-texto">...</p>
            <p id="frase-autor">— ...</p>
        </div>

        <div class="video-destaque">
            <div id="player-destaque"></div>
        </div>

        <!-- ==================== NU METAL ==================== -->
        <div class="categoria cat-nu-metal" id="nu-metal" data-aos="fade-up">
            <div class="titulo-com-pentagrama">
                <i class="fas fa-link icon-tema"></i>
                <h2>Nu Metal</h2>
                <i class="fas fa-skull icon-tema"></i>
            </div>
            <div class="videos">

                <iframe src="https://www.youtube.com/embed/m9NEjUb_Ag0" title="Limp Bizkit - Rollin'" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
                <iframe src="https://www.youtube.com/embed/nRz-yw-wp34" title="Korn - Twist" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>

        </div>

        <div class="divider">
            <i class="fas fa-skull"></i><i class="fas fa-axe"></i><i class="fas fa-skull"></i>
        </div>

        <!-- ==================== RAPTuga ==================== -->
        <div class="categoria cat-raptuga" id="raptuga" data-aos="fade-up">
            <div class="titulo-com-pentagrama">
                <i class="fas fa-microphone icon-tema"></i>
                <h2>RapTuga</h2>
                <i class="fas fa-fire icon-tema"></i>
            </div>
            <div class="videos">
                <iframe src="https://www.youtube.com/embed/J9VlkMxl6wk" title="Atlantis" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
                <iframe src="https://www.youtube.com/embed/_95Vqd38i0o" title="Peel Me" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
                <iframe src="https://www.youtube.com/embed/urOBTEqo4RE" title="Quando a Minha Vóz" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>

        <div class="divider">
            <i class="fas fa-skull"></i><i class="fas fa-axe"></i><i class="fas fa-skull"></i>

        <!-- ==================== DEFTONES ==================== -->
        <div class="categoria cat-deftones" id="deftones" data-aos="fade-up">
            <div class="titulo-com-pentagrama">
                <i class="fas fa-water icon-tema"></i>

        <!-- ==================== S.O.A.D ==================== -->
        <div class="categoria cat-soad" id="soad" data-aos="fade-up">
            <div class="titulo-com-pentagrama">
                <i class="fas fa-fire icon-tema"></i>
                <h2>S.O.A.D</h2>
                <i class="fas fa-bolt icon-tema"></i>
            </div>

                <iframe src="https://www.youtube.com/embed/0zW_Dt-SFR8" title="Sugar" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
                <iframe src="https://www.youtube.com/embed/DnGdoEa1tPg" title="Lonely Day" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
            </div>
        </div>

        <div class="divider">
            <i class="fas fa-skull"></i><i class="fas fa-axe"></i><i class="fas fa-skull"></i>
        </div>

        <!-- ==================== METALLICA ==================== -->
        <div class="categoria cat-metallica" id="metallica" data-aos="fade-up">
            <div class="titulo-com-pentagrama">
                <i class="fas fa-bolt icon-tema"></i>
                <h2>METALLICA</h2>
                <i class="fas fa-guitar icon-tema"></i>
            </div>
            <div class="videos">
