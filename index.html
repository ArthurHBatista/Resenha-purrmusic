<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Stars</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Germania+One&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<style>
html{scroll-behavior:smooth}
body{background:#000;font-family:'Gill Sans','Gill Sans MT',Calibri,'Trebuchet MS',sans-serif;color:#fff;margin:0;padding:0;min-height:100vh;position:relative;overflow-x:hidden;transition:background .8s ease}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 30%,rgba(255,0,0,0.08) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(255,0,0,0.04) 0%,transparent 40%),url('https://www.transparenttextures.com/patterns/asfalt-dark.png') repeat;opacity:.8;pointer-events:none;z-index:-2;transition:background .8s ease}
body.modo-noite::before{background:radial-gradient(circle at 20% 30%,rgba(51,170,255,.10) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(51,170,255,.05) 0%,transparent 40%),url('https://www.transparenttextures.com/patterns/asfalt-dark.png') repeat}
body.modo-noite h1{text-shadow:0 0 10px #fff,0 0 30px #3af,0 0 60px #069,0 0 100px #036;background:linear-gradient(180deg,#001a2a 0%,#000 100%);box-shadow:0 0 20px rgba(51,170,255,.5),0 0 40px rgba(51,170,255,.3),inset 0 0 20px rgba(51,170,255,.2)}
body.modo-noite .pentagram{color:#036;text-shadow:0 0 10px #3af,0 0 20px #069}
body.modo-noite .pentagram:hover{text-shadow:0 0 30px #3af,0 0 60px #6cf,0 0 100px #3af}
body.modo-noite #top-nav{border-bottom-color:#036;box-shadow:0 0 30px #012}
body.modo-noite #top-nav a:hover{color:#6cf;text-shadow:0 0 20px #3af;background:rgba(51,170,255,.1)}
body.modo-noite .frase-box{border-left-color:#3af;box-shadow:0 0 20px rgba(51,170,255,.3)}
body.modo-noite #frase-autor{color:#6cf;text-shadow:0 0 10px #3af}
body.modo-noite .divider{color:#036}
body.modo-noite .divider::before,body.modo-noite .divider::after{background:linear-gradient(90deg,transparent,#036,transparent)}
body.modo-noite .rune{color:#036}
body.modo-noite footer{border-top-color:#036}
body.modo-noite footer .social a:hover{color:#3af;text-shadow:0 0 20px #3af}
.botao-modo{position:fixed;top:80px;right:20px;z-index:101;background:linear-gradient(180deg,#1a0000 0%,#000 100%);color:#fff;border:2px solid #900;border-radius:50%;width:50px;height:50px;cursor:pointer;font-size:1.3rem;display:flex;align-items:center;justify-content:center;transition:.3s;box-shadow:0 0 15px rgba(255,0,0,.5)}
.botao-modo:hover{transform:scale(1.1) rotate(20deg);box-shadow:0 0 25px #f00;border-color:#f00}
body.modo-noite .botao-modo{border-color:#069;background:linear-gradient(180deg,#001a2a 0%,#000 100%);box-shadow:0 0 15px rgba(51,170,255,.5)}
body.modo-noite .botao-modo:hover{box-shadow:0 0 25px #3af;border-color:#3af}
#btn-topo{position:fixed;bottom:100px;right:20px;z-index:101;background:linear-gradient(180deg,#1a0000 0%,#000 100%);color:#fff;border:2px solid #900;border-radius:50%;width:50px;height:50px;cursor:pointer;font-size:1.3rem;display:flex;align-items:center;justify-content:center;transition:.3s;box-shadow:0 0 15px rgba(255,0,0,.5);opacity:0;visibility:hidden;pointer-events:none}
#btn-topo.visivel{opacity:1;visibility:visible;pointer-events:auto}
#btn-topo:hover{transform:scale(1.1) translateY(-3px);box-shadow:0 0 25px #f00;border-color:#f00}
body.modo-noite #btn-topo{border-color:#069;background:linear-gradient(180deg,#001a2a 0%,#000 100%)}
body.modo-noite #btn-topo:hover{box-shadow:0 0 25px #3af;border-color:#3af}
#easter-egg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s ease;padding:20px;box-sizing:border-box}
#easter-egg.ativo{opacity:1;visibility:visible}
#easter-egg .simbolo{font-size:12rem;color:#f00;text-shadow:0 0 40px #f00,0 0 80px #900,0 0 120px #600;animation:ritual 2s ease-in-out infinite}
@keyframes ritual{0%,100%{transform:scale(1) rotate(0deg);opacity:.8}50%{transform:scale(1.15) rotate(180deg);opacity:1}}
#easter-egg .msg{font-family:'Cinzel Decorative',cursive;font-size:2rem;color:#fff;text-shadow:0 0 20px #f00,0 0 40px #900;margin-top:30px;letter-spacing:6px;text-align:center;text-transform:uppercase}
#easter-egg .sub{font-family:'Germania One',cursive;font-size:1.1rem;color:#a00;margin-top:20px;letter-spacing:3px;text-align:center}
#easter-egg .fechar{margin-top:40px;padding:10px 25px;background:transparent;border:2px solid #f00;color:#fff;font-family:'Germania One',cursive;letter-spacing:3px;font-size:1rem;cursor:pointer;border-radius:8px;transition:.3s}
#easter-egg .fechar:hover{background:#f00;box-shadow:0 0 25px #f00}
.container{max-width:1200px;margin:0 auto;padding:30px;position:relative;z-index:1}
#top-nav{position:sticky;top:0;z-index:100;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);border-bottom:3px solid #900;box-shadow:0 0 30px #600;padding:10px 0;margin-bottom:20px;transition:.8s ease}
#top-nav ul{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 15px;list-style:none;margin:0;padding:0 20px}
#top-nav a{color:#fff;text-decoration:none;font-family:'Germania One',cursive;font-size:1rem;letter-spacing:1.5px;padding:5px 12px;transition:.3s;border-radius:5px}
#top-nav a:hover{color:#f33;text-shadow:0 0 20px #f00;background:rgba(255,0,0,.1)}
h1{font-family:'Cinzel Decorative',cursive;font-size:50px;text-align:center;color:#fff;text-shadow:0 0 10px #fff,0 0 30px #f00,0 0 60px #c00,0 0 100px #600;letter-spacing:6px;border:3px solid #fff;padding:15px;text-transform:uppercase;margin-top:30px;margin-bottom:50px;font-weight:900;background:linear-gradient(180deg,#1a0000 0%,#000 100%);border-radius:15px;box-shadow:0 0 20px rgba(255,255,255,.5),0 0 40px rgba(255,0,0,.3),inset 0 0 20px rgba(255,0,0,.2);display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;transition:.8s ease}
.pentagram{display:inline-block;font-size:2.5rem;color:#a00;text-shadow:0 0 10px #f00,0 0 20px #600;transition:transform .6s ease,text-shadow .3s ease;cursor:pointer;line-height:1;user-select:none}
.pentagram:hover{transform:rotate(360deg) scale(1.2);text-shadow:0 0 30px #f00,0 0 60px #f33,0 0 100px #f00}
.titulo-com-pentagrama{display:flex;justify-content:center;align-items:center;gap:15px;flex-wrap:wrap}
.titulo-com-pentagrama .pentagram{font-size:2rem}
.frase-box{max-width:800px;margin:0 auto 50px auto;padding:25px 30px;background:linear-gradient(180deg,#0a0000 0%,#000 100%);border-left:5px solid #f00;border-radius:12px;box-shadow:0 0 20px rgba(255,0,0,.3),inset 0 0 15px rgba(255,0,0,.05);text-align:center;transition:.8s ease}
.frase-box:hover{border-left-color:#f33;box-shadow:0 0 30px rgba(255,0,0,.5);transform:scale(1.01)}
#frase-texto{font-family:'Uncial Antiqua',cursive;font-size:1.35rem;color:#fff;line-height:1.6;margin:0 0 12px 0;font-style:italic;text-shadow:0 0 8px rgba(255,0,0,.4)}
#frase-autor{font-family:'Germania One',cursive;font-size:1.1rem;color:#f33;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 10px #f00;margin:0}
.categoria{margin-bottom:50px;padding:25px;background:linear-gradient(180deg,#0a0000 0%,#000 100%);border:3px solid #fff;border-radius:20px;box-shadow:0 0 15px rgba(255,255,255,.3),0 0 30px rgba(255,0,0,.2),inset 0 0 15px rgba(255,0,0,.1);position:relative;overflow:hidden;transition:.4s ease}
.categoria::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 40%,rgba(255,0,0,.08),transparent 60%);opacity:0;transition:.5s;pointer-events:none}
.categoria:hover::after{opacity:1}
h2{font-family:'Germania One',cursive;font-size:32px;text-align:center;color:#fff;text-shadow:0 0 5px #fff,0 0 15px #f00,0 0 30px #c00,0 0 60px #600;padding:12px;margin:0 0 35px 0;text-transform:uppercase;letter-spacing:4px;font-weight:bold;border:2px solid #fff;border-radius:10px;background:linear-gradient(90deg,#1a0000 0%,#0a0000 50%,#1a0000 100%);box-shadow:0 0 10px rgba(255,255,255,.4),0 0 20px rgba(255,0,0,.3)}
.cat-nu-metal{border-color:#f00;box-shadow:0 0 20px rgba(255,0,0,.6),0 0 40px rgba(255,0,0,.3),inset 0 0 20px rgba(255,0,0,.15)}
.cat-nu-metal h2{border-color:#f00;color:#f33;background:linear-gradient(90deg,#2a0000 0%,#0a0000 50%,#2a0000 100%)}
.cat-nu-metal .icon-tema{color:#f00}
.cat-raptuga{border-color:#fa0;box-shadow:0 0 20px rgba(255,170,0,.5),0 0 40px rgba(255,170,0,.25),inset 0 0 20px rgba(255,170,0,.12)}
.cat-raptuga h2{border-color:#fa0;color:#fc3;background:linear-gradient(90deg,#2a1a00 0%,#0a0500 50%,#2a1a00 100%)}
.cat-raptuga .icon-tema{color:#fa0}
.cat-deftones{border-color:#3af;box-shadow:0 0 20px rgba(51,170,255,.5),0 0 40px rgba(51,170,255,.25),inset 0 0 20px rgba(51,170,255,.12)}
.cat-deftones h2{border-color:#3af;color:#6cf;background:linear-gradient(90deg,#001a2a 0%,#000a0a 50%,#001a2a 100%)}
.cat-deftones .icon-tema{color:#3af}
.cat-soad{border-color:#f60;box-shadow:0 0 20px rgba(255,102,0,.6),0 0 40px rgba(255,102,0,.3),inset 0 0 20px rgba(255,102,0,.15)}
.cat-soad h2{border-color:#f60;color:#f83;background:linear-gradient(90deg,#2a0f00 0%,#0a0500 50%,#2a0f00 100%)}
.cat-soad .icon-tema{color:#f60}
.cat-metallica{border-color:#ccc;box-shadow:0 0 20px rgba(204,204,204,.5),0 0 40px rgba(204,204,204,.25),inset 0 0 20px rgba(204,204,204,.12)}
.cat-metallica h2{border-color:#ccc;color:#e6e6e6;background:linear-gradient(90deg,#1a1a1a 0%,#0a0a0a 50%,#1a1a1a 100%)}
.cat-metallica .icon-tema{color:#ccc}
.cat-folk-metal{border-color:#6c3;box-shadow:0 0 20px rgba(102,204,51,.5),0 0 40px rgba(102,204,51,.25),inset 0 0 20px rgba(102,204,51,.12)}
.cat-folk-metal h2{border-color:#6c3;color:#8d5;background:linear-gradient(90deg,#0a2a00 0%,#050a00 50%,#0a2a00 100%)}
.cat-folk-metal .icon-tema{color:#6c3}
.cat-death-metal{border-color:#8b0000;box-shadow:0 0 20px rgba(139,0,0,.7),0 0 45px rgba(139,0,0,.35),0 0 80px rgba(74,0,0,.2),inset 0 0 25px rgba(139,0,0,.2);background:linear-gradient(180deg,#150000 0%,#050000 100%)}
.cat-death-metal h2{border-color:#8b0000;color:#c22;background:linear-gradient(90deg,#2a0000 0%,#150000 50%,#2a0000 100%);text-shadow:0 0 8px #f00,0 0 20px #8b0000,0 0 40px #4a0000}
.cat-death-metal .icon-tema{color:#c00;text-shadow:0 0 15px #8b0000}
.cat-death-metal .videos iframe{box-shadow:0 0 10px rgba(255,255,255,.6),0 0 30px rgba(139,0,0,.4),0 0 60px rgba(74,0,0,.2)}
.cat-death-metal .videos iframe:hover{border-color:#8b0000;box-shadow:0 0 20px #fff,0 0 45px #c00,0 0 90px #8b0000,inset 0 0 30px #4a0000}
.icon-tema{font-size:2rem;transition:transform .6s ease,filter .3s ease;cursor:default;display:inline-block}
.icon-tema:hover{transform:rotate(360deg) scale(1.2);filter:drop-shadow(0 0 15px currentColor)}
.videos{display:flex;flex-wrap:wrap;justify-content:center;gap:35px}
.videos iframe{width:380px;height:214px;border:4px solid #fff;border-radius:12px;box-shadow:0 0 10px rgba(255,255,255,.6),0 0 30px rgba(255,0,0,.3),0 0 60px rgba(255,0,0,.1);transition:.4s ease}
.videos iframe:hover{transform:scale(1.03) rotate(.5deg)}
.cat-nu-metal .videos iframe:hover{border-color:#f00;box-shadow:0 0 20px #fff,0 0 40px #f00,0 0 80px #600}
.cat-raptuga .videos iframe:hover{border-color:#fa0;box-shadow:0 0 20px #fff,0 0 40px #fa0,0 0 80px #640}
.cat-deftones .videos iframe:hover{border-color:#3af;box-shadow:0 0 20px #fff,0 0 40px #3af,0 0 80px #036}
.cat-soad .videos iframe:hover{border-color:#f60;box-shadow:0 0 20px #fff,0 0 40px #f60,0 0 80px #610}
.cat-metallica .videos iframe:hover{border-color:#ccc;box-shadow:0 0 20px #fff,0 0 40px #ccc,0 0 80px #444}
.cat-folk-metal .videos iframe:hover{border-color:#6c3;box-shadow:0 0 20px #fff,0 0 40px #6c3,0 0 80px #140}
.video-destaque{display:flex;justify-content:center;margin-bottom:50px}
#player-destaque{width:500px;height:281px;border:4px solid #fff;border-radius:15px;box-shadow:0 0 30px rgba(255,255,255,.7),0 0 80px rgba(255,0,0,.4),0 0 120px rgba(255,0,0,.2);transition:.3s}
#player-destaque:hover{border-color:#f00;box-shadow:0 0 20px #fff,0 0 60px #f00,0 0 100px #600;transform:scale(1.02)}
.divider{display:flex;justify-content:center;align-items:center;gap:20px;color:#a00;font-size:2.2rem;margin:10px 0 40px 0;transition:.8s ease}
.divider::before,.divider::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,transparent,#a00,transparent);transition:.8s ease}
.divider .pentagram{font-size:2rem}
.rune{position:fixed;bottom:20px;right:20px;font-size:5rem;color:#822;opacity:.15;animation:spinRune 20s linear infinite;pointer-events:none;z-index:2;transition:color .8s ease}
@keyframes spinRune{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.2)}100%{transform:rotate(360deg) scale(1)}}
footer{margin-top:60px;padding:30px 0;border-top:3px solid #900;text-align:center;background:linear-gradient(180deg,#000,#0a0000);font-family:'Germania One',cursive;transition:.8s ease}
footer .social a{color:#fff;font-size:2rem;margin:0 15px;transition:.3s;display:inline-block}
footer .social a:hover{color:#f00;text-shadow:0 0 20px #f00;transform:scale(1.2)}
footer .social a.instagram:hover{color:#f39;text-shadow:0 0 20px #f39}
footer .copy{margin-top:15px;opacity:.6;font-size:.9rem}
footer .copy i{color:#a00}
@media (max-width:768px){
.container{padding:15px}
h1{font-size:30px;padding:10px;gap:10px}
.pentagram{font-size:1.8rem}
.titulo-com-pentagrama .pentagram{font-size:1.5rem}
.icon-tema{font-size:1.5rem}
h2{font-size:24px}
.videos iframe{width:100%;height:auto;aspect-ratio:16/9}
#player-destaque{width:100%;height:auto;aspect-ratio:16/9}
#top-nav ul{gap:8px}
#top-nav a{font-size:.85rem;padding:4px 8px;letter-spacing:1px}
.rune{font-size:3rem;bottom:10px;right:10px}
.frase-box{padding:20px}
#frase-texto{font-size:1.1rem}
#frase-autor{font-size:.95rem}
.botao-modo{width:42px;height:42px;font-size:1.1rem;top:70px;right:10px}
#btn-topo{width:42px;height:42px;font-size:1.1rem;bottom:80px;right:10px}
#easter-egg .simbolo{font-size:7rem}
#easter-egg .msg{font-size:1.3rem;letter-spacing:3px}
#easter-egg .sub{font-size:.9rem}
}
::selection{background:#f00;color:#fff}
</style>
</head>
<body>

<button class="botao-modo" id="botao-modo" title="Alternar modo">🌙</button>
<button id="btn-topo" title="Voltar ao topo"><i class="fas fa-arrow-up"></i></button>

<div id="easter-egg">
<div class="simbolo">⛧</div>
<div class="msg">Você invocou o ritual</div>
<div class="sub">O metal te ouviu. Siga em frente, filho do inferno. 🤘</div>
<button class="fechar" onclick="fecharEasterEgg()">FECHAR</button>
</div>

<nav id="top-nav">
<ul>
<li><a href="#nu-metal">Nu Metal</a></li>
