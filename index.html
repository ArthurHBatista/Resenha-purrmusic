<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PURRmusic – Gore & Folk Metal</title>

    <!-- Fontes temáticas -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Germania+One&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <!-- Font Awesome (ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- AOS - Animações ao rolar -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <style>
        /* ========== CSS BASE (seu estilo original + melhorias) ========== */
        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #000000;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 0, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 0, 0.05) 0%, transparent 40%),
                linear-gradient(180deg, #0a0a0a 0%, #000000 100%);
            min-height: 100vh;
            position: relative;
        }

        /* Camada de textura sobre o fundo (sem vídeo agora) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png') repeat;
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        /* ===== MENU ===== */
        #top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 3px solid #990000;
            box-shadow: 0 0 30px #660000;
            padding: 10px 0;
            margin-bottom: 20px;
        }
        #top-nav ul {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px 30px;
            list-style: none;
            margin: 0;
            padding: 0 20px;
        }
        #top-nav a {
            color: #fff;
            text-decoration: none;
            font-family: 'Germania One', cursive;
            font-size: 1.2rem;
            letter-spacing: 2px;
            padding: 5px 15px;
            transition: 0.3s;
            border-radius: 5px;
        }
        #top-nav a:hover {
            color: #ff3333;
            text-shadow: 0 0 20px #ff0000;
            background: rgba(255, 0, 0, 0.1);
        }

        /* ===== TÍTULO ===== */
        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 50px;
            text-align: center;
            color: #ffffff;
            text-shadow:
                0 0 10px #ffffff,
                0 0 30px #ff0000,
                0 0 60px #cc0000,
                0 0 100px #660000;
            letter-spacing: 6px;
            border: 3px solid #ffffff;
            padding: 15px;
            text-transform: uppercase;
            margin-top: 30px;
            margin-bottom: 50px;
            font-weight: 900;
            background: linear-gradient(180deg, #1a0000 0%, #000000 100%);
            border-radius: 15px;
            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.5),
                0 0 40px rgba(255, 0, 0, 0.3),
                inset 0 0 20px rgba(255, 0, 0, 0.2);
        }

        /* ===== CATEGORIAS ===== */
        .categoria {
            margin-bottom: 50px;
            padding: 25px;
            background: linear-gradient(180deg, #0a0000 0%, #000000 100%);
            border: 3px solid #ffffff;
            border-radius: 20px;
            box-shadow:
                0 0 15px rgba(255, 255, 255, 0.3),
                0 0 30px rgba(255, 0, 0, 0.2),
                inset 0 0 15px rgba(255, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }
        .categoria::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 0, 0, 0.08), transparent 60%);
            opacity: 0;
            transition: 0.5s;
            pointer-events: none;
        }
        .categoria:hover::after {
            opacity: 1;
        }

        h2 {
            font-family: 'Germania One', cursive;
            font-size: 32px;
            text-align: center;
            color: #ffffff;
            text-shadow:
                0 0 5px #ffffff,
                0 0 15px #ff0000,
                0 0 30px #cc0000,
                0 0 60px #660000;
            padding: 12px;
            margin: 0 0 35px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
            border: 2px solid #ffffff;
            border-radius: 10px;
            background: linear-gradient(90deg, #1a0000 0%, #0a0000 50%, #1a0000 100%);
            box-shadow:
                0 0 10px rgba(255, 255, 255, 0.4),
                0 0 20px rgba(255, 0, 0, 0.3);
        }

        /* ===== VÍDEOS (iframe normais) ===== */
        .videos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 35px;
        }

        .videos iframe {
            width: 380px;
            height: 214px;
            border: 4px solid #ffffff;
            border-radius: 12px;
            box-shadow:
                0 0 10px rgba(255, 255, 255, 0.6),
                0 0 30px rgba(255, 0, 0, 0.3),
                0 0 60px rgba(255, 0, 0, 0.1);
            transition: 0.4s ease;
        }

        .videos iframe:hover {
            border-color: #ff0000;
            box-shadow:
                0 0 20px #ffffff,
                0 0 40px #ff0000,
                0 0 80px #660000,
                inset 0 0 30px #ff0000;
            transform: scale(1.03) rotate(0.5deg);
        }

        /* ===== VÍDEO DESTAQUE (com API) ===== */
        .video-destaque {
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
        }

        #player-destaque {
            width: 500px;
            height: 281px;
            border: 4px solid #ffffff;
            border-radius: 15px;
            box-shadow:
                0 0 30px rgba(255, 255, 255, 0.7),
                0 0 80px rgba(255, 0, 0, 0.4),
                0 0 120px rgba(255, 0, 0, 0.2);
            transition: 0.3s;
        }
        #player-destaque:hover {
            border-color: #ff0000;
            box-shadow:
                0 0 20px #ffffff,
                0 0 60px #ff0000,
                0 0 100px #660000;
            transform: scale(1.02);
        }

        /* ===== DIVISÓRIAS ===== */
        .divider {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            color: #aa0000;
            font-size: 2.2rem;
            margin: 10px 0 40px 0;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, #aa0000, transparent);
        }

        /* ===== RUNA ===== */
        .rune {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 5rem;
            color: #882222;
            opacity: 0.15;
            animation: spinRune 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes spinRune {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* ===== RODAPÉ ===== */
        footer {
            margin-top: 60px;
            padding: 30px 0;
            border-top: 3px solid #990000;
            text-align: center;
            background: linear-gradient(180deg, #000, #0a0000);
            font-family: 'Germania One', cursive;
        }
        footer .social a {
            color: #fff;
            font-size: 2rem;
            margin: 0 15px;
            transition: 0.3s;
        }
        footer .social a:hover {
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
        }
        footer .copy {
            margin-top: 15px;
            opacity: 0.6;
            font-size: 0.9rem;
        }
        footer .copy i {
            color: #aa0000;
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 768px) {
            .container { padding: 15px; }
            h1 { font-size: 30px; padding: 10px; }
            h2 { font-size: 24px; }
            .videos iframe {
                width: 100%;
                height: auto;
                aspect-ratio: 16/9;
            }
            #player-destaque {
                width: 100%;
                height: auto;
                aspect-ratio: 16/9;
            }
            #top-nav ul { gap: 10px; }
            #top-nav a { font-size: 1rem; padding: 5px 10px; }
            .rune { font-size: 3rem; bottom: 10px; right: 10px; }
        }

        ::selection {
            background-color: #ff0000;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <!-- Menu fixo -->
    <nav id="top-nav">
        <ul>
            <li><a href="#nu-metal">Nu Metal</a></li>
            <li><a href="#raptuga">RapTuga</a></li>
            <li><a href="#deftones">Deftones</a></li>
            <li><a href="#soad">S.O.A.D</a></li>
            <li><a href="#metallica">METALLICA</a></li>
        </ul>
    </nav>

    <div class="container">

        <h1>PurrMusic</h1>

        <!-- Vídeo em destaque (agora com a API do YouTube) -->
        <div class="video-destaque">
            <div id="player-destaque"></div>
        </div>

        <!-- ==================== CATEGORIA: Nu Metal ==================== -->
        <div class="categoria" id="nu-metal" data-aos="fade-up">

        <div class="divider"><i class="fas fa-skull"></i><i class="fas fa-axe"></i><i class="fas fa-skull"></i></div>

        <div class="categoria" id="raptuga" data-aos="fade-up">

        <div class="categoria" id="deftones" data-aos="fade-up">
            <h2>Deftones</h2>
            <div class="videos">
                <iframe src="https://www.youtube.com/embed/eS8FBesGg9o" title="Diamond Eyes" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
                <iframe src="https://www.youtube.com/embed/XOzs1FehYOA" title="My Own Summer" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>

        <div class="divider"><i class="fas fa-skull"></i><i class="fas fa-axe"></i><i class="fas fa-skull"></i></div>

        <div class="categoria" id="soad" data-aos="fade-up">
            <h2>S.O.A.D</h2>
            <div class="videos">

        <div class="divider"><i class="fas fa-skull"></i><i class="fas fa-axe"></i><i class="fas fa-skull"></i></div>

        <!-- ==================== CATEGORIA: METALLICA ==================== -->
        <div class="categoria" id="metallica" data-aos="fade-up">
            <h2>METALLICA</h2>
            <div class="videos">
                <iframe src="https://www.youtube.com/embed/CD-E-LDc384" title="Enter Sandman" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>

            </div>

    </div> <!-- .container -->

    <!-- Runa decorativa -->
    <div class="rune">ᚠ</div>

    <!-- Rodapé -->
    <footer>
        <p>⚔️ PurrMusic – Sangue, Fúria e Metal ⚔️</p>
        <div class="social">
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
            <a href="#" aria-label="Spotify"><i class="fab fa-spotify"></i></a>
        </div>
        <p class="copy">© 2026 – Feito com <i class="fas fa-skull"></i> e <i class="fas fa-fire"></i></p>
    </footer>

    <!-- Inicialização do AOS -->
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-out-quad'
        });
    </script>

    <!-- ====== API DO YOUTUBE PARA O VÍDEO DESTAQUE ====== -->
    <script>
        // Carrega a API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var playerDestaque;

        function onYouTubeIframeAPIReady() {
            playerDestaque = new YT.Player('player-destaque', {
                height: '281',
                width: '500',
                videoId: 'EETV2JNBhcc', // ID do vídeo (troque se quiser)
                playerVars: {
                    'playsinline': 1,
                    'rel': 0,
                    'controls': 1,
                    'modestbranding': 1
                },
                events: {
                    'onReady': function(event) {
                        // Ao passar o mouse, toca; ao sair, pausa
                        var container = document.getElementById('player-destaque');
                        container.addEventListener('mouseenter', function() {
                            playerDestaque.playVideo();
                        });
                        container.addEventListener('mouseleave', function() {
                            playerDestaque.pauseVideo();
                        });
                    }
                }
            });
        }
    </script>

</body>

</html>
